  <script>
    (() => {
      const root = document.getElementById('l3-seeded-routes-20260929');
      const select = root.querySelector('#l3-route-seed');
      const svg = root.querySelector('.l3-map');
      const summary = root.querySelector('#l3-route-summary');
      const layouts = JSON.parse(root.querySelector('#l3-route-data').textContent);
      const ns = 'http://www.w3.org/2000/svg';
      const height = 606;
      let seed = 1;
      const validSeed = value => layouts.some(layout => layout.seed === Number(value)) ? Number(value) : 1;
      const savedSeed = state => validSeed(state && state.modelContent && state.modelContent.seed);
      const element = (tag, attrs, text) => {
        const node = document.createElementNS(ns, tag);
        Object.entries(attrs || {}).forEach(([name, value]) => node.setAttribute(name, String(value)));
        if (text !== undefined) node.textContent = text;
        return node;
      };
      const label = id => id === 'Arrival' ? 'Start' : id === 'Exit' ? 'Ud' : id === 'SignalHall' ? 'S' : id.slice(-2);
      function draw() {
        const layout = layouts.find(item => item.seed === seed);
        if (!layout) return;
        const width = Math.max(1, Math.round(root.getBoundingClientRect().width));
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        svg.setAttribute('height', height);
        svg.replaceChildren();
        svg.appendChild(element('title', {id:'l3-map-title'}, `Level 3, seed ${seed}: 26 rum fordelt på tre distrikter`));
        svg.appendChild(element('desc', {id:'l3-map-description'}, `Skematisk, ikke målfast. 31 forbindelser, heraf seks ekstra forbindelser og en skjult finalerute på 560 studs. ${layout.rooms.filter(room => room[4]).map(room => 'CD i ' + room[0]).join('. ')}. Forbindelser: ${layout.links.map(link => link[0] + ' til ' + link[1]).join('; ')}.`));
        const positions = new Map();
        layout.rooms.forEach(room => {
          const [id, district, row, column] = room;
          let x, y;
          if (id === 'Arrival') { x = 25; y = 78 + (row - 1) * 62; }
          else if (id === 'Exit') { x = width - 92; y = 576; }
          else { x = 78 + (column - 1) * (width - 110) / 3; y = 78 + (district - 1) * 181 + (row - 1) * 62; }
          positions.set(id, {x, y});
        });
        for (let district = 1; district <= 3; district++) {
          svg.appendChild(element('rect', {class:'district', x:55, y:49 + (district-1)*181, width:Math.max(0,width-64), height:120, rx:4}));
          svg.appendChild(element('text', {x:9, y:39 + (district-1)*181}, `D${district}`));
        }
        layout.links.forEach(link => {
          const [aId, bId, type, door] = link;
          const a = positions.get(aId), b = positions.get(bId);
          const final = door === 'HiddenExit';
          const path = final
            ? `M ${a.x+22} ${a.y} H ${width-3} V ${b.y} H ${b.x+22}`
            : `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
          svg.appendChild(element('path', {class:'route' + (type === 'InternalLoop' ? ' loop' : '') + (final ? ' finale' : ''), d:path, 'data-link':aId+'|'+bId}));
        });
        layout.rooms.forEach(room => {
          const [id, district, row, column, cd] = room;
          const p = positions.get(id);
          const group = element('g', {'data-room':id, 'aria-label':`${id}${cd ? ', CD-rum' : ''}`});
          group.appendChild(element('rect', {class:'room' + (cd ? ' cd-room' : ''), x:p.x-22, y:p.y-17, width:44, height:34, rx:4}));
          group.appendChild(element('text', {x:p.x, y:p.y, 'text-anchor':'middle', 'dominant-baseline':'central'}, label(id)));
          if (cd) group.appendChild(element('circle', {class:'cd-dot', cx:p.x+15, cy:p.y-10, r:3}));
          svg.appendChild(group);
        });
        svg.appendChild(element('text', {x:width-37, y:551, 'text-anchor':'end'}, 'Finale · 560 studs'));
        select.value = String(seed);
        summary.textContent = `Seed ${seed} · 26 rum · 31 forbindelser · Skematisk, ikke målfast`;
        root.dataset.seed = String(seed);
        root.dataset.layoutHash = layout.hash;
      }
      seed = savedSeed(window.openai && window.openai.widgetState);
      select.addEventListener('change', () => {
        seed = validSeed(select.value);
        draw();
        if (window.openai && typeof window.openai.setWidgetState === 'function') {
          window.openai.setWidgetState({modelContent:{seed}, privateContent:null}).catch(() => {});
        }
      });
      window.addEventListener('openai:set_globals', event => {
        const globals = event.detail && event.detail.globals;
        if (globals && Object.prototype.hasOwnProperty.call(globals, 'widgetState')) {
          seed = savedSeed(globals.widgetState);
          draw();
        }
      });
      if (typeof ResizeObserver !== 'undefined') new ResizeObserver(draw).observe(root);
      draw();
    })();
  </script>
